<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Critical Strike Ops 2 (Version 1.4)</title>
    <style>
        :root { --accent: #fca311; --gold: #ffd700; --bg: #0a0a0b; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', Tahoma, sans-serif; color: white; user-select: none; }
        
        /* ГЛАВНОЕ МЕНЮ */
        #menu-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5000; background: radial-gradient(circle at 30% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.98) 100%); display: flex; flex-direction: column; justify-content: center; padding-left: 80px; }
        h1 { font-size: 50px; margin: 0; text-shadow: 0 0 20px var(--accent); font-style: italic; color: #fff; }
        
        .menu-box { display: flex; flex-direction: column; gap: 12px; width: 340px; margin-top: 20px; }
        .btn { background: rgba(255,255,255,0.08); color: white; border: 1px solid #444; padding: 15px; font-size: 16px; cursor: pointer; text-align: left; transition: 0.2s; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .btn:hover { background: var(--accent); color: black; padding-left: 25px; }
        .btn-play { background: var(--accent); color: black; font-size: 26px; border: none; }
        
        input { background: #111; color: white; border: 1px solid #444; padding: 12px; border-radius: 4px; }

        /* ИНТЕРФЕЙС ИГРЫ */
        #hud { position: absolute; bottom: 40px; left: 40px; z-index: 1000; display: none; }
        #top-bar { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: none; background: rgba(0,0,0,0.9); padding: 10px 50px; border-radius: 5px; border-bottom: 3px solid var(--accent); z-index: 1000; font-size: 24px; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; z-index: 2000; display: none; }
        .ch-line { position: absolute; background: #0f0; box-shadow: 0 0 5px #0f0; }

        /* AWP SCOPE */
        #awp-scope { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 25%, black 80%); display: none; z-index: 1500; pointer-events: none; border: 2px solid black; }

        /* ОКНА */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 6000; background: rgba(0,0,0,0.98); display: none; flex-direction: column; align-items: center; padding: 50px; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; width: 100%; max-width: 1100px; margin-top: 20px; }
        .card { background: #151515; padding: 20px; border-radius: 5px; border-bottom: 4px solid var(--accent); text-align: center; }
        
        #killfeed { position: absolute; top: 25px; right: 25px; z-index: 1000; }
        .k-row { background: rgba(0,0,0,0.8); padding: 6px 15px; margin-bottom: 5px; border-right: 4px solid var(--accent); font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div id="menu-ui">
        <h1>Critical Strike Ops 2</h1>
        <div style="color:#666; font-size: 14px;">Version 1.4 | Stable Engine</div>
        <div class="menu-box">
            <input type="text" id="nick-name" placeholder="ТВОЙ НИК" value="Player">
            <button class="btn btn-play" id="btn-start">В БОЙ</button>
            <button class="btn" onclick="openOverlay('market')">МАРКЕТ</button>
            <button class="btn" onclick="openOverlay('inv')">ИНВЕНТАРЬ</button>
            <button class="btn" style="border: 1px dashed var(--accent)" onclick="usePromo()">ПРОМОКОД</button>
            <div style="font-size:22px; margin-top:10px;">БАЛАНС: <span id="m-ui" style="color:var(--accent)">$1000</span></div>
        </div>
    </div>

    <div id="awp-scope">
        <div style="position:absolute; top:50%; width:100%; height:1px; background:rgba(0,255,0,0.4)"></div>
        <div style="position:absolute; left:50%; height:100%; width:1px; background:rgba(0,255,0,0.4)"></div>
    </div>

    <div id="crosshair">
        <div class="ch-line" style="width:20px; height:2px; top:9px;"></div>
        <div class="ch-line" style="width:2px; height:20px; left:9px;"></div>
    </div>

    <div id="top-bar"><span id="pk-ui" style="color:var(--accent)">0</span> : <span id="bk-ui">0</span></div>

    <div id="hud">
        <div id="hp-ui" style="font-size:50px; font-weight:900;">100+</div>
        <div style="color:var(--accent); font-weight:bold; font-size: 18px;">
            $<span id="c-ui">1000</span> | <span id="wp-ui">GLOCK</span>
        </div>
    </div>

    <div id="killfeed"></div>

    <div id="market-overlay" class="overlay">
        <h2>SKIN MARKET</h2>
        <button class="btn" style="width:150px; text-align:center" onclick="closeOverlay()">НАЗАД</button>
        <div class="grid" id="market-grid"></div>
    </div>

    <div id="inv-overlay" class="overlay">
        <h2>ИНВЕНТАРЬ</h2>
        <button class="btn" style="width:150px; text-align:center" onclick="closeOverlay()">НАЗАД</button>
        <div class="grid" id="inv-grid"></div>
    </div>

    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } } </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let scene, camera, renderer, controls, weaponMesh;
        let isPlaying = false, isZoomed = false, hp = 100, cash = 1000, pKills = 0, bKills = 0;
        let enemies = [], mySkins = [], equippedSkins = {};
        let activeSlot = 2, velocity = new THREE.Vector3(), prevTime = performance.now();
        let moveKeys = { w: false, a: false, s: false, d: false };

        const weaponStats = [
            { id:'ak47', name:'AK-47', dmg:100, slot:1, len:0.8, col:0x3d2b1f, p:2700, range: 100 },
            { id:'awp', name:'AWP', dmg:150, slot:1, len:1.3, col:0x1a2e1a, p:4750, range: 200 },
            { id:'deagle', name:'Deagle', dmg:100, slot:2, len:0.4, col:0x444444, p:700, range: 60 },
            { id:'glock', name:'Glock', dmg:25, slot:2, len:0.3, col:0x222222, p:200, range: 40 },
            { id:'knife', name:'Knife', dmg:100, slot:3, len:0.5, col:0x111111, p:0, range: 2.2 } 
        ];

        let inv = { 1: weaponStats[0], 2: weaponStats[3], 3: weaponStats[4] };

        function init() {
            loadGame();
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 0, 80);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new PointerLockControls(camera, document.body);
            scene.add(controls.getObject());

            scene.add(new THREE.AmbientLight(0xffffff, 1));
            const light = new THREE.DirectionalLight(0xffffff, 0.7);
            light.position.set(10, 50, 10);
            scene.add(light);

            // ПОЛ (Версия 1.4)
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(300, 300),
                new THREE.MeshStandardMaterial({color: 0x444444, roughness: 0.8})
            );
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            generateMarket();
            animate();

            document.getElementById('btn-start').addEventListener('click', () => {
                controls.lock();
                startBattle();
            });

            window.addEventListener('keydown', (e) => {
                if(e.code==='KeyW') moveKeys.w=true; if(e.code==='KeyA') moveKeys.a=true;
                if(e.code==='KeyS') moveKeys.s=true; if(e.code==='KeyD') moveKeys.d=true;
                if(e.code==='Space' && isPlaying && camera.position.y <= 1.61) velocity.y += 12;
                if(['1','2','3'].includes(e.key)) { activeSlot = parseInt(e.key); switchWeapon(); stopZoom(); }
            });
            window.addEventListener('keyup', (e) => {
                if(e.code==='KeyW') moveKeys.w=false; if(e.code==='KeyA') moveKeys.a=false;
                if(e.code==='KeyS') moveKeys.s=false; if(e.code==='KeyD') moveKeys.d=false;
            });
            window.addEventListener('mousedown', (e) => {
                if(!isPlaying) return;
                if(e.button === 0) performAction();
                if(e.button === 2 && inv[activeSlot]?.id === 'awp') toggleZoom();
            });
            window.oncontextmenu = (e) => e.preventDefault();

            controls.addEventListener('lock', () => {
                document.getElementById('menu-ui').style.display='none';
                document.getElementById('hud').style.display='block';
                document.getElementById('top-bar').style.display='block';
                document.getElementById('crosshair').style.display='block';
                isPlaying = true;
            });
            controls.addEventListener('unlock', () => {
                isPlaying = false; stopZoom();
                document.getElementById('menu-ui').style.display='flex';
            });
        }

        function toggleZoom() {
            isZoomed = !isZoomed;
            camera.fov = isZoomed ? 18 : 75;
            camera.updateProjectionMatrix();
            document.getElementById('awp-scope').style.display = isZoomed ? 'block' : 'none';
            document.getElementById('crosshair').style.display = isZoomed ? 'none' : 'block';
            if(weaponMesh) weaponMesh.visible = !isZoomed;
        }

        function stopZoom() { isZoomed = false; camera.fov = 75; camera.updateProjectionMatrix(); document.getElementById('awp-scope').style.display = 'none'; document.getElementById('crosshair').style.display = 'block'; if(weaponMesh) weaponMesh.visible = true; }

        function switchWeapon() {
            if(weaponMesh) camera.remove(weaponMesh);
            const w = inv[activeSlot];
            if(!w) return;
            weaponMesh = new THREE.Group();
            const col = equippedSkins[w.id] || w.col;
            const gun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, w.len), new THREE.MeshStandardMaterial({color: col}));
            const arm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.4), new THREE.MeshStandardMaterial({color: 0xffdbac}));
            arm.position.set(0.1, -0.1, 0.2);
            weaponMesh.add(gun, arm);
            weaponMesh.position.set(0.3, -0.28, -0.45);
            camera.add(weaponMesh);
            document.getElementById('wp-ui').innerText = w.name;
        }

        function performAction() {
            const w = inv[activeSlot];
            if(!w) return;
            weaponMesh.position.z += 0.1; setTimeout(()=> weaponMesh.position.z -= 0.1, 50);
            
            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = ray.intersectObjects(enemies, true);
            
            if(hits.length > 0) {
                const hit = hits[0];
                const bot = hit.object.parent;
                if(hit.distance <= w.range) { // НОЖ УБИВАЕТ ТОЛЬКО ВПЛОТНУЮ
                    bot.userData.hp -= w.dmg;
                    if(bot.userData.hp <= 0) {
                        pKills++; cash += 300; uiUpdate(); saveGame();
                        scene.remove(bot);
                        enemies = enemies.filter(e => e !== bot);
                        setTimeout(spawnBot, 2000);
                    }
                }
            }
        }

        function spawnBot() {
            const bot = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.3, 0.4), new THREE.MeshStandardMaterial({color: 0x442222}));
            body.position.y = 0.65;
            bot.add(body);
            bot.position.set((Math.random()-0.5)*120, 0, (Math.random()-0.5)*120);
            bot.userData = { name: "Terrorist", hp: 100, lastShot: performance.now() };
            scene.add(bot); enemies.push(bot);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if(isPlaying) {
                velocity.y -= 25 * delta;
                const speed = isZoomed ? 0.05 : 0.2;
                if(moveKeys.w) controls.moveForward(speed); if(moveKeys.s) controls.moveForward(-speed);
                if(moveKeys.a) controls.moveRight(-speed); if(moveKeys.d) controls.moveRight(speed);
                
                controls.getObject().position.y += (velocity.y * delta);
                if(controls.getObject().position.y < 1.6) { velocity.y = 0; controls.getObject().position.y = 1.6; }

                // Логика ботов без зависаний
                for(let i = enemies.length - 1; i >= 0; i--) {
                    const bot = enemies[i];
                    bot.lookAt(camera.position.x, 0, camera.position.z);
                    if(time - bot.userData.lastShot > 3200) {
                        hp -= 15; bKills++; uiUpdate();
                        bot.userData.lastShot = time;
                        if(hp <= 0) {
                            isPlaying = false;
                            controls.unlock();
                            alert("ВАС УБИЛИ!");
                            hp = 100; uiUpdate();
                            break; 
                        }
                    }
                }
            }
            prevTime = time;
            renderer.render(scene, camera);
        }

        // МАРКЕТ И ЛОГИКА
        function generateMarket() {
            const grid = document.getElementById('market-grid'); grid.innerHTML = '';
            const allItems = [...weaponStats, {id:'awp_lore', name:'AWP LORE', col:0xffd700, p:150000, slot:1, wid:'awp'}];
            allItems.forEach(w => {
                if(w.p === 0) return;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<b>${w.name}</b><br>$${w.p}<br><button class="btn" style="width:100%; text-align:center" onclick="buyItem('${w.id}', '${w.name}', ${w.col}, ${w.p}, ${w.slot || 1})">КУПИТЬ</button>`;
                grid.appendChild(card);
            });
        }

        window.buyItem = (wid, sname, col, p, slot) => {
            if(cash >= p) { cash -= p; mySkins.push({wid, sname, col, p, slot}); uiUpdate(); saveGame(); alert("Куплено!"); }
            else alert("Недостаточно денег!");
        };

        window.usePromo = () => {
            const code = prompt("ВВЕДИ КОД:");
            if(code === 'TGK93') { mySkins.push({wid:'deagle', sname:'SUNSET', col:0xff4500, p:15000, slot:2}); alert("Скин Deagle добавлен!"); }
            else if(code === 'TRYV810') { mySkins.push({wid:'ak47', sname:'GOLD', col:0xffd700, p:80000, slot:1}); alert("Золотой AK!"); }
            else if(code === 'ESYA_KOD_ESLI_UAUAAU_EST_67U_DADDA_ADMINN0') { cash = 1000000; alert("ADMIN ON"); }
            else alert("Код неверный!");
            uiUpdate(); saveGame();
        };

        function saveGame() { localStorage.setItem('csops2_v14_save', JSON.stringify({ cash, mySkins, equippedSkins, nick: document.getElementById('nick-name').value })); }
        function loadGame() {
            const s = localStorage.getItem('csops2_v14_save');
            if(s) { const d = JSON.parse(s); cash = d.cash; mySkins = d.mySkins; equippedSkins = d.equippedSkins; document.getElementById('nick-name').value = d.nick; }
            uiUpdate();
        }

        function startBattle() {
            hp = 100; pKills = 0; bKills = 0;
            enemies.forEach(e => scene.remove(e)); enemies = [];
            for(let i=0; i<6; i++) spawnBot();
            switchWeapon(); uiUpdate();
        }

        window.openOverlay = (id) => { document.getElementById(id+'-overlay').style.display='flex'; if(id==='inv') renderInventory(); };
        window.closeOverlay = () => document.querySelectorAll('.overlay').forEach(o=>o.style.display='none');
        
        function renderInventory() {
            const grid = document.getElementById('inv-grid'); grid.innerHTML = '';
            mySkins.forEach((s, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<b>${s.sname}</b><br><button class="btn" style="width:100%; text-align:center" onclick="equipItem(${i})">ВЗЯТЬ</button>`;
                grid.appendChild(card);
            });
        }
        
        window.equipItem = (i) => { 
            const s = mySkins[i]; equippedSkins[s.wid || s.id] = s.col; 
            const base = weaponStats.find(x => x.id === (s.wid || s.id));
            if(base) inv[base.slot] = base;
            saveGame(); alert("Выбрано!"); 
        };

        function uiUpdate() {
            document.getElementById('m-ui').innerText = "$"+cash;
            document.getElementById('c-ui').innerText = cash;
            document.getElementById('hp-ui').innerText = hp + "+";
            document.getElementById('pk-ui').innerText = pKills;
            document.getElementById('bk-ui').innerText = bKills;
        }

        init();
    </script>
</body>
</html>
